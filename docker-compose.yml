# StreamVault — production deployment via Docker Compose.
#
# Prerequisites:
#   1. Copy .env.example to .env and configure all values:
#      cp .env.example .env
#   2. Build and start:
#      docker compose up -d --build
#
# The app is available at http://localhost:${PORT:-3000}.
# First run creates the database automatically (db:prepare).
#
# On your first browser visit, set an exactly 4-digit PIN.
# Later locked visits use the same PIN; Settings changes it, and Lock ends the session.
#
# Containers restart automatically and survive system reboots
# (restart: unless-stopped + Docker's systemd service).

services:
  web:
    build:
      context: .
    env_file: .env
    ports:
      - "${PORT:-3000}:80"
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-streamvault}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-streamvault}
      LOCAL_TORRENT_ENABLED: ${LOCAL_TORRENT_ENABLED:-true}
      TORRSERVER_URL: http://torrserver:8090
      LOCAL_TORRENT_MIN_FREE_BYTES: ${LOCAL_TORRENT_MIN_FREE_BYTES:-5368709120}
      LOCAL_TORRENT_CACHE_PATH: /rails/storage/local_torrents
      LOCAL_TORRENT_GLOBAL_CACHE_BYTES: ${LOCAL_TORRENT_GLOBAL_CACHE_BYTES:-16106127360}
      LOCAL_TORRENT_HEARTBEAT_TIMEOUT: ${LOCAL_TORRENT_HEARTBEAT_TIMEOUT:-1800}
      LOCAL_TORRENT_PER_TORRENT_CACHE_BYTES: ${LOCAL_TORRENT_PER_TORRENT_CACHE_BYTES:-2147483648}
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - ./storage/torrserver/cache:/rails/storage/local_torrents:ro
    depends_on:
      db:
        condition: service_healthy
      torrserver:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - sv-shared
      - torrent-control

  torrserver:
    # Release-pinned stream-first BitTorrent sidecar. It has no host port:
    # only the authenticated Rails web container can reach its API/stream.
    image: ghcr.io/yourok/torrserver:MatriX.142.2@sha256:e1fa821e375772d38bf39e65b50ca9bcff4851a08bf688d0e323951fcfd7729b
    environment:
      TORRSERVER_USERNAME: ${TORRSERVER_USERNAME:?set TORRSERVER_USERNAME in .env}
      TORRSERVER_PASSWORD: ${TORRSERVER_PASSWORD:?set TORRSERVER_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /opt/ts/config /opt/ts/torrents /opt/ts/cache
        printf '{"%s":"%s"}\n' "$$TORRSERVER_USERNAME" "$$TORRSERVER_PASSWORD" > /opt/ts/config/accs.db
        chmod 600 /opt/ts/config/accs.db
        exec torrserver --path /opt/ts/config --logpath /opt/ts/log --port 8090 --torrentsdir /opt/ts/torrents --dontkill --httpauth
    volumes:
      - ./storage/torrserver:/opt/ts
    expose:
      - "8090"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - torrent-control
      - torrent-egress

  db:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-streamvault}
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamvault}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  sv-shared:
    external: true
  # Private authenticated control plane shared only by Rails and TorrServer.
  torrent-control:
    internal: true
  # Dedicated internet egress for tracker/DHT/peer traffic; no DB or app peers.
  torrent-egress:
